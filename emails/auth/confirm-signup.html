<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to the Shape Shifter</title>
</head>

<body
  style="margin:0;padding:0;background-color:#f7f7f5;font-family:'Montserrat',ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f7f7f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width:520px;background-color:#1f2d3d;border-radius:16px;padding:32px;">
          <tr>
            <td style="padding-bottom:16px">
              <p
                style="margin:0;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:#f7f7f5;">
                Shape Shifter</p>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:16px">
              <h1 style="margin:0;font-size:24px;font-weight:700;line-height:1.3;color:#f7f7f5;">You're
                almost in...</h1>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px">
              <p style="margin:0;font-size:16px;line-height:1.6;color:#f7f7f5cc;">Enter this code to confirm
                your email and finish creating your account.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px">
              <p
                style="margin:0;display:inline-block;padding:14px 28px;background-color:#f7f7f5;color:#1f2d3d;font-size:28px;font-weight:700;letter-spacing:0.3em;border-radius:16px;">
                {{ .Token }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #f7f7f520;padding-top:16px">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#f7f7f560;">This code expires
                shortly and can only be used once.
                If you didn't sign up for Shape Shifter, you can safely ignore this.</p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#1f2d3d99;">© 2026 Shape Shifter</p>
      </td>
    </tr>
  </table>
</body>

</html>
